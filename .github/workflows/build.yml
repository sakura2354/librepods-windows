name: Build LibrePods Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtconnectivity qtmultimedia'

    - name: Configure CMake
      run: |
        cmake -B windows/build -S windows `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build windows/build --config Release

    - name: Bundle Qt & OpenSSL Dependencies
      shell: powershell
      run: |
        # 1. 创建打包输出目录
        New-Item -ItemType Directory -Path "dist" -Force

        # 2. 查找并复制主程序
        $exe = Get-ChildItem -Path "windows/build" -Filter "librepods-windows.exe" -Recurse | Select-Object -First 1
        if (-not $exe) {
          Write-Error "Could not find librepods-windows.exe!"
          exit 1
        }
        Copy-Item $exe.FullName -Destination "dist/librepods-windows.exe"

        # 3. 运行 windeployqt 打包 Qt 库（直接使用环境变量中的 windeployqt）
        windeployqt --compiler-runtime `
                    --qmldir windows `
                    --plugindir "dist/plugins" `
                    --no-translations `
                    --verbose 1 `
                    "dist/librepods-windows.exe"

        # 4. 自动定位 windeployqt 路径并拷贝 OpenSSL 依赖 (libcrypto*.dll 和 libssl*.dll)
        $windeployPath = (Get-Command windeployqt).Source
        $qtBinDir = Split-Path $windeployPath -Parent

        Get-ChildItem -Path $qtBinDir -Filter "libcrypto*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist"
        Get-ChildItem -Path $qtBinDir -Filter "libssl*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "dist"

    - name: Compress Build Artifact
      shell: powershell
      run: |
        Compress-Archive -Path "dist/*" -DestinationPath "librepods-windows-x64.zip" -Force

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: librepods-windows-x64
        path: librepods-windows-x64.zip
