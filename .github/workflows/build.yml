name: Build LibrePods Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    timeout-minutes: 360

    steps:

    # 拉取源码
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive


    # 安装 Qt6
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.3
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: qtconnectivity qtmultimedia
        cache: true


    # 安装 vcpkg
    - name: Install vcpkg
      shell: cmd
      run: |
        git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
        cd C:\vcpkg
        bootstrap-vcpkg.bat


    # 安装 OpenSSL
    - name: Install dependencies
      shell: cmd
      run: |
        C:\vcpkg\vcpkg install openssl:x64-windows


    # 配置 CMake
    - name: Configure CMake
      shell: cmd
      run: |

        cd windows

        mkdir build

        cd build


        cmake .. ^
        -DCMAKE_BUILD_TYPE=Release ^
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
        -DCMAKE_PREFIX_PATH=%Qt6_DIR%



    # 编译
    - name: Build
      shell: cmd
      run: |

        cd windows\build

        cmake --build . --config Release



    # Qt自动部署
    - name: Deploy Qt
      shell: cmd
      run: |

        cd windows\build\Release


        "%Qt6_DIR%\bin\windeployqt.exe" ^
        --release ^
        --compiler-runtime ^
        --qmldir ..\.. ^
        librepods-windows.exe



    # 查看输出文件
    - name: Check build output
      shell: cmd
      run: |

        dir windows\build\Release

        dir windows\build\Release\platforms



    # 上传成品
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:

        name: LibrePods-Windows

        path: |

          windows/build/Release/**
