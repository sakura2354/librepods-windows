name: Build LibrePods Windows

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtconnectivity qtmultimedia qtdeclarative'

    - name: Configure CMake
      run: |
        cmake -B windows/build -S windows `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

    - name: Build Project
      run: |
        cmake --build windows/build --config Release

    - name: Bundle Qt Dependencies (windeployqt)
      shell: powershell
      run: |
        # 创建打包输出目录
        New-Item -ItemType Directory -Path "dist" -Force

        # 查找生成的 exe 文件
        $exe = Get-ChildItem -Path "windows/build" -Filter "librepods-windows.exe" -Recurse | Select-Object -First 1
        if (-not $exe) {
          Write-Error "Could not find librepods-windows.exe!"
          exit 1
        }
        
        # 复制主程序到打包目录
        Copy-Item $exe.FullName -Destination "dist/librepods-windows.exe"

        # 运行 windeployqt 补充 Qt、QML 和依赖 DLL
        windeployqt --no-compiler-runtime --qmldir windows dist/librepods-windows.exe

    - name: Compress Build Artifact
      shell: powershell
      run: |
        Compress-Archive -Path "dist/*" -DestinationPath "librepods-windows-x64.zip"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: librepods-windows-x64
        path: librepods-windows-x64.zip
